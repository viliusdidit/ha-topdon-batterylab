exchange:
  name: Exchange raw frames
  description: >-
    Write one or more raw TOPDON commands and return every notification heard
    afterwards. Protocol-exploration tool: the reply does not have to decode, so
    it works on opcodes whose payload layout is not known yet.
  fields:
    commands:
      name: Commands
      description: >-
        Hex commands, first two bytes are the opcode, the rest are arguments.
        Framing and checksum are added automatically. Example "BF00" polls
        state; "BF05 01" selects the 12 V Norm family.
      required: true
      example: '["BF00"]'
      selector:
        object:
    listen:
      name: Listen seconds
      description: How long to keep collecting notifications after the last write.
      default: 5
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: s
    gap:
      name: Gap seconds
      description: Delay between consecutive commands.
      default: 2.5
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: s
